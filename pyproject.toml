[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golocal-data"
version = "0.1.0"
description = "goLocal database, ingestion, and AI search functions"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "python-dotenv>=1,<2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pglast>=7,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
